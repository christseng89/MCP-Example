services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    image: n8n-with-time:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5778:5678"
    env_file:
      - .env
    environment:
      # REMOVE these three (they override your .env with localhost/http):
      # N8N_HOST: 0.0.0.0
      # N8N_PROTOCOL: http
      # WEBHOOK_URL: http://localhost:5778

      DB_SQLITE_POOL_SIZE: "1"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

      # Community nodes
      N8N_COMMUNITY_PACKAGES: '["@tavily/n8n-nodes-tavily","n8n-nodes-qdrant"]'

      # Merge external libs you want in Function/Code nodes
      NODE_FUNCTION_ALLOW_EXTERNAL: axios,lodash,dayjs,jsonwebtoken
    volumes:
      - "C:/n8n/n8n-data:/home/node/.n8n"
      - "C:/n8n/local-files:/files"
